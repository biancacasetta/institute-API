spring:
  application:
    name: your-application-name
  datasource:
    url: jdbc:postgresql://localhost:5432/your-db
    username: postgres
    password: your_password_here
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    error:
      include-message: always
  data:
    web:
      pageable:
        max-page-size: 100

institute:
  timezone: UTC